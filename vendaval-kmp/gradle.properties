# ---------------------------------------------------------------------------
# JVM / daemon sizing
# ---------------------------------------------------------------------------
# Deliberately conservative: this project is expected to build on machines with
# limited free RAM. Parallel execution is off because the Kotlin/Native and
# Android compilers each spawn their own daemon and would otherwise contend.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false

# ---------------------------------------------------------------------------
# Kotlin Multiplatform
# ---------------------------------------------------------------------------
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=false

# Apple targets require a full Xcode installation (not just Command Line
# Tools). Flip this to `true` on a machine with Xcode to enable the iOS
# targets; the iosMain source set and the Xcode project ship regardless so no
# code is lost when the targets are off.
vendaval.enableIos=false

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false
